name: muzik_oynatici
description: "Doganlar — Bir sanatçılı premium saz çalar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # ─── Audio Playback ────────────────────────────────────────────────────────
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  just_audio_media_kit: ^2.0.0
  media_kit: ^1.1.10
  ffi: ^2.1.3

  # ─── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ─── UI & Animation ────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0
  palette_generator: ^0.3.3+3

  # ─── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ─── Serialization (Immutable Models) ──────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ─── Utilities ─────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.4.3

  # ─── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Album cover art
    - assets/images/albums/
    # Artist photos
    - assets/images/artist/
    # IMO icon
    - assets/images/imo/
    # TikTok icon
    - assets/images/tiktok/
    # Doğanlar Surat photo
    - assets/images/doganlar_surat/
    # App icon
    - assets/images/icon/
    # Audio tracks (local playback; swap paths with remote URLs for streaming)
    - assets/audio/
    # Optional JSON data fallback
    - assets/data/

  # No custom font files needed — google_fonts downloads at runtime.
  # If offline support is required, download and declare fonts here.
